<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市场热点监控</title>
<style>
:root{
  --bg:#0b0d10;--panel:#12151a;--panel2:#171b21;--line:#232830;--line2:#1b1f26;
  --text:#e8ebf0;--muted:#8b93a1;--dim:#5f6774;--accent:#f0b90b;--accent2:#ffd666;
  --up:#16c784;--down:#ea3943;--up-bg:#0f2a20;--down-bg:#2d1418;
  --s:#ff5a5f;--a:#f5a524;--b:#6b8afd;--radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
.shell{max-width:1440px;margin:0 auto;padding:18px 20px 60px}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{margin:0;font-size:19px;letter-spacing:-.01em}
.brand .meta{display:flex;gap:8px;align-items:center;margin-top:3px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.dot.off{background:var(--down);box-shadow:none}
.src{padding:1px 7px;border:1px solid var(--line);border-radius:999px;font-size:11px}
.src.ok{color:var(--up);border-color:#1d4a37}.src.bad{color:var(--down);border-color:#4a1d22}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a414c}.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1400}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sm{padding:4px 9px;font-size:11px}
.stale{margin-top:10px;padding:8px 12px;border:1px solid #5a4410;background:#221a06;border-radius:8px;color:var(--accent2);font-size:12px}

/* 今日主线 */
.mainline{margin:14px 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:14px 16px}
.label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.mainline h2{margin:0 0 10px;font-size:17px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.chip small{color:var(--dim);font-size:10px}
.cross{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cross div{padding:8px 10px;background:var(--panel2);border-radius:8px;min-width:0}
.cross b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.cross span{font-size:14px;font-weight:600}
.fed{margin-top:8px;font-size:12px;color:var(--muted)}
.fed b{color:var(--text)}

/* 行情观察：和有明确事件来源的热点分开，不提供推送入口 */
.usopen{margin:0 0 14px;padding:10px 14px!important}
.usopen .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.usopen h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.usopen h4 .chip{font-size:11px;font-weight:500;padding:1px 8px}
.usopen .head small{color:var(--dim);font-size:11px}
.us-grid{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(0,2.1fr);gap:14px}
.us-push{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;min-width:0}
.us-title{font-size:12px;color:var(--muted);margin-bottom:4px}
.us-push p{margin:0 0 8px;font-size:13px;font-weight:600;line-height:1.55}
.us-top{display:grid;grid-template-columns:16px minmax(0,1fr) auto 62px;gap:6px;align-items:center;font-size:12px;padding:3px 0;border-top:1px solid var(--line2)}
.us-top i{font-style:normal;color:var(--dim)}.us-top b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.us-top small{color:var(--dim);font-size:10px;margin-left:4px}.us-top span{text-align:right}
.us-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;align-content:start}
.us-tile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;padding:4px 8px;border-radius:6px;background:var(--panel2);font-size:12px;min-width:0}
.us-tile b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.us-tile small{color:var(--dim);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.us-tile .num{text-align:right;font-weight:700}
.us-tile.off{opacity:.55}
@media (max-width:1100px){.us-grid{grid-template-columns:minmax(0,1fr)}.us-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.us-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 1h 行情异动：带关联币对、文案与单条推送，不与事件热点混用 */
.watch{margin:0 0 14px;padding:10px 14px!important}
.watch .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.watch h4{margin:0;font-size:14px;white-space:nowrap}.watch small{color:var(--dim);font-size:11px}
.watch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.watch-col{display:grid;gap:1px;align-content:start;min-width:0}
.watch-col h5{margin:0 0 2px;font-size:11px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.watch-col h5 em{font-style:normal;color:var(--dim);font-weight:500}
.watch-row{display:grid;grid-template-columns:minmax(0,1fr) 58px 52px 66px auto;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;font-size:12px;min-width:0}
.watch-row:nth-child(even){background:var(--panel2)}
.watch-row b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.watch-row small{color:var(--dim);font-size:11px;white-space:nowrap}
.watch-row i{font-style:normal;color:var(--muted);font-size:10px;text-align:right;white-space:nowrap}
.watch-row span.num{text-align:right;font-weight:700}
.watch-row .tag{font-size:10px;padding:0 5px;margin-left:4px;font-weight:500}
@media (max-width:760px){.watch-row{grid-template-columns:minmax(0,1fr) 52px 62px auto}.watch-row i{display:none}}

/* 过滤器 */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg button em{font-style:normal;color:var(--dim);margin-left:4px}

/* 布局 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.side{display:grid;gap:14px;min-width:0}

/* 热点卡片 */
.hot{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.hs{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.hs.S{border-left-color:var(--s)}.hs.A{border-left-color:var(--a)}.hs.B{border-left-color:var(--b)}
.hs-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.lv{width:40px;text-align:center;border-radius:8px;padding:4px 0 3px;font-weight:800;font-size:15px;line-height:1.1}
.lv small{display:block;font-size:9px;font-weight:600;letter-spacing:-1px;margin-top:2px}
.lv.S{background:#3a1416;color:#ff9b9e}.lv.A{background:#3a2a0c;color:#ffc56b}.lv.B{background:#18203d;color:#a9baff}
.hs-title{min-width:0}
.hs-title h3{margin:0;font-size:16px;line-height:1.35;word-break:break-word}
.hs-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pair{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;background:#2a2206;border:1px solid #5a4410;color:var(--accent2);font-weight:700;font-size:12px}
.pair::before{content:"关联";font-weight:500;color:#b89a4a;font-size:10px}
.tag{padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);font-size:11px}
.tag.crypto{color:#8fd3ff}.tag.tradfi{color:#c9a7ff}
.hs-pct{text-align:right}
.hs-pct b{font-size:20px;display:block;line-height:1.1}
.hs-pct small{color:var(--dim);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.stats div{background:var(--panel2);padding:6px 9px;min-width:0}
.stats div>span{display:block;font-size:10px;color:var(--dim)}
.stats b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.why{display:grid;gap:5px;font-size:13px}
.why p{margin:0;color:#c4cad3}
.why p b{color:var(--text);margin-right:6px;font-weight:600}
.news{display:flex;flex-direction:column;gap:3px}
.news a{font-size:12px;color:#9fb4ff;text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.news a:hover{text-decoration:underline}
.news a em{font-style:normal;color:var(--dim);margin-left:6px}
.hs-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line2)}
.hs-foot .muted{font-size:11px}
.copy{display:none;margin-top:4px}
.copy.open{display:block}
.copy-tabs{display:flex;gap:4px;margin-bottom:6px}
.copy-tabs button{font:inherit;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
.copy-tabs button.on{color:var(--text);border-color:#3a414c;background:var(--panel2)}
.copy pre{margin:0;white-space:pre-wrap;font:inherit;font-size:12px;line-height:1.6;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:#d7dce4}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}

/* 侧栏 */
.side h4{margin:0;font-size:14px}
.side .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side .head small{color:var(--dim);font-size:11px}
.cal-day{font-size:11px;color:var(--accent);font-weight:700;margin:10px 0 4px}
.cal-day:first-child{margin-top:0}
.cal{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:12px;align-items:center}
.cal-day+.cal{border-top:0}
.cal time{color:var(--muted);font-size:11px}
.cal b{font-weight:600;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal small{color:var(--dim);font-size:11px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stars{color:var(--accent);font-size:11px;white-space:nowrap}
.rank{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;padding:5px 0;font-size:12px;border-top:1px solid var(--line2)}
.rank:first-of-type{border-top:0}
.rank i{font-style:normal;color:var(--dim)}
.rank b small.tok{display:block;font-weight:400;font-size:10px;color:var(--dim)}
.rank b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{display:grid;grid-template-columns:92px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.bar span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .track{height:6px;background:var(--panel2);border-radius:3px;position:relative;overflow:hidden}
.bar .track i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar b{text-align:right;font-weight:600}
.nitem{padding:7px 0;border-top:1px solid var(--line2);font-size:12px}
.nitem:first-of-type{border-top:0}
.nitem a{text-decoration:none;display:block;line-height:1.45}
.nitem a:hover{color:var(--accent2)}
.nitem small{color:var(--dim);font-size:11px}
.event-group+.event-group{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.event-group h5{margin:0 0 5px;font-size:11px;letter-spacing:.05em;color:var(--muted)}

/* 今日记录 */
.records{margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.t{white-space:normal;min-width:220px}
td a{text-decoration:none}td a:hover{color:var(--accent2)}
.pager{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}

/* 弹窗：卡片预览 */
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#1f2329;border-radius:12px;border:1px solid #333a44}
.lk-head{padding:12px 16px;border-radius:12px 12px 0 0;font-weight:700}
.lk-head small{display:block;font-weight:400;opacity:.85;font-size:12px}
.lk-head.green{background:#1d5a36}.lk-head.red{background:#6b1f24}.lk-head.purple{background:#4a2c8a}
.lk-body{padding:12px 16px;display:grid;gap:10px;font-size:13px}
.lk-body p{margin:0;white-space:pre-wrap}
.lk-body details{border:1px solid #3a414c;border-radius:6px;padding:6px 10px}
.lk-body summary{cursor:pointer}
.lk-body hr{border:0;border-top:1px solid #3a414c;margin:2px 0}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid #333a44}

@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.side{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .shell{padding:14px 12px 40px}.mainline{grid-template-columns:1fr}.cross{grid-template-columns:repeat(2,minmax(0,1fr))}
  .watch-grid{grid-template-columns:minmax(0,1fr)}
  .watch .head small{display:none}
  .side{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hs-head{grid-template-columns:auto minmax(0,1fr)}.hs-pct{grid-column:1/-1;text-align:left;display:flex;gap:8px;align-items:baseline}
  .records{overflow-x:auto}
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">
      <h1 id="brand">市场热点监控</h1>
      <div class="meta"><i class="dot" id="liveDot"></i><span id="updated">加载中…</span><span id="sources"></span></div>
    </div>
    <div class="actions" id="actions">
      <button class="btn" data-post="/api/sync/calendar">同步日历</button>
      <button class="btn" data-post="/api/sync/bitable">同步表格</button>
      <button class="btn" data-preview="morning">预览早报</button>
      <button class="btn" data-post="/api/push/morning" data-confirm="确认把早报推送到 Lark 群？">推送早报</button>
      <button class="btn primary" id="refresh">刷新</button>
    </div>
  </header>
  <div class="stale" id="stale" hidden></div>

  <section class="mainline">
    <div class="panel pad">
      <div class="label">今日主线</div>
      <h2 id="mainText">—</h2>
      <div class="chips" id="sectorChips"></div>
    </div>
  </section>

  <section class="panel pad usopen" id="usopenPanel">
    <div class="head">
      <div><h4>美股开盘异动 <span class="chip" id="usPhase">—</span></h4><small id="usMeta"></small></div>
      <div class="actions us-actions">
        <button class="btn sm" id="usRefresh">刷新报价</button>
        <button class="btn sm" data-preview="usopen">预览卡片</button>
        <button class="btn sm primary" data-push="usopen">推送 Lark</button>
      </div>
    </div>
    <div class="us-grid">
      <div class="us-push"><div class="us-title" id="usTitle">—</div><p id="usText">—</p><div id="usTop"></div></div>
      <div class="us-tiles" id="usTiles"></div>
    </div>
  </section>

  <section class="panel pad watch">
    <div class="head"><h4>1h 行情异动</h4><small id="shortMeta">近 1 小时涨跌达到阈值 · 已生成推广文案 · 支持单条推送 Lark</small></div>
    <div class="watch-grid" id="observations"></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="marketSeg">
      <button class="on" data-market="all">全部<em id="cAll">0</em></button>
      <button data-market="crypto">Crypto<em id="cCrypto">0</em></button>
      <button data-market="tradfi">TradFi<em id="cTradfi">0</em></button>
    </div>
    <div class="seg" id="levelSeg">
      <button class="on" data-level="all">全部等级</button>
      <button data-level="S">S</button><button data-level="A">A 及以上</button>
    </div>
  </div>

  <div class="layout">
    <section class="hot" id="hotspots"></section>
    <aside class="side">
      <section class="panel pad"><div class="head"><h4>热点日历</h4><small>北京时间 UTC+8 · 美东时间 ET</small></div><div id="calendar"></div></section>
      <section class="panel pad">
        <div class="head"><h4>行情排行</h4>
          <div class="seg" id="rankSeg"><button class="on" data-rank="movers_top10">涨跌 Top10</button><button data-rank="volume_top10">成交额</button><button data-rank="stock_top10">美股 / ETF</button></div>
        </div>
        <div id="rankings"></div>
        <small class="muted" id="rankNote"></small>
      </section>
      <section class="panel pad"><div class="head"><h4>板块热度</h4><small>中位数 24h</small></div><div id="sectors"></div></section>
      <section class="panel pad"><div class="head"><h4>关联资讯</h4><small>官方已确认 / CMC 待人工确认</small></div>
        <div class="event-group"><h5>CRYPTO</h5><div id="cryptoNews"></div></div>
        <div class="event-group"><h5>TRADFI</h5><div id="tradfiNews"></div></div>
      </section>
    </aside>
  </div>

  <section class="panel pad records">
    <div class="head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h4 style="margin:0">今日热点记录</h4><small class="muted" id="recCount"></small></div>
    <table><thead><tr><th>首次发现</th><th>热点名称</th><th>关联标的</th><th>市场</th><th>信号</th><th>等级</th><th class="num">24h</th></tr></thead><tbody id="records"></tbody></table>
    <div class="pager"><button class="btn sm" id="prev">上一页</button><span id="page">1/1</span><button class="btn sm" id="next">下一页</button></div>
  </section>

"半导体三倍做多","kind":"etf","sector":"半导体","pair":"SOXL/USDT","us_session":true,"price":152.601,"pct":-3.970171795356,"pct_1h":-0.701566112351,"market_status":"early-hours","volume_usd":339509752.56,"tokenized_price":152.49080712556005,"source":"CMC TradFi","since_open":null},{"symbol":"KORU","name":"韩国三倍做多","kind":"etf","sector":"韩国市场","pair":"KORU/USDT","us_session":true,"price":18.845,"pct":-6.009975062344,"pct_1h":0.223227294505,"market_status":"early-hours","volume_usd":88267448.61,"tokenized_price":18.793822728815705,"source":"CMC TradFi","since_open":null},{"symbol":"ZHIPU","name":"智谱","kind":"stock","sector":"AI 应用","pair":"ZHIPU/USDT","us_session":false}],"quoted_at":"16:19:46","missing":["ZHIPU"],"samples":0,"rank_mode":"abs","sources":[{"name":"cmc_rwa","label":"CMC RWA 接口","ok":true,"cooling_min":0,"last_ok":"10-08 16:19","last_error":"","last_count":28},{"name":"cmc_page","label":"CMC RWA 网页","ok":true,"cooling_min":0,"last_ok":"10-06 09:20","last_error":"","last_count":16},{"name":"nasdaq","label":"Nasdaq","ok":true,"cooling_min":0,"last_ok":"10-06 09:20","last_error":"","last_count":11},{"name":"cmc_pro","label":"CMC API","ok":true,"cooling_min":0,"last_ok":"10-08 16:19","last_error":"","last_count":2}],"sources_used":["cmc_rwa"]}};</script>
<script>
const SNAP = window.__SNAPSHOT__ || null;
let D = SNAP, market = 'all', level = 'all', rankKey = 'movers_top10', recPage = 1;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v;
const pct = (v, d = 1) => { const n = num(v); return n === null ? '<span class="muted">—</span>' : `<span class="num ${n > 0 ? 'up' : n < 0 ? 'down' : ''}">${n > 0 ? '+' : ''}${n.toFixed(d)}%</span>`; };
const price = v => { const n = num(v); if (n === null || n === 0) return '—'; return n >= 1000 ? '$' + n.toLocaleString('en-US', {maximumFractionDigits: 0}) : n >= 10 ? '$' + n.toFixed(2) : n >= 1 ? '$' + n.toFixed(3) : '$' + n.toPrecision(4); };
const usd = v => { const n = num(v); if (!n) return '—'; for (const [s, u] of [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']]) if (n >= s) return '$' + (n / s).toFixed(2) + u; return '$' + n.toFixed(0); };
const LV = {S: 3, A: 2, B: 1};

function token() { try { return sessionStorage.getItem('hotspot_admin_token') || ''; } catch (e) { return ''; } }
function saveToken(t) { try { sessionStorage.setItem('hotspot_admin_token', t); } catch (e) {} }
async function post(url) {
  let res = await fetch(url, {method: 'POST', headers: {'X-Admin-Token': token()}});
  if (res.status === 401) {
    const t = prompt('请输入管理口令（服务器 .env 中的 ADMIN_TOKEN）');
    if (!t) throw new Error('未输入口令');
    saveToken(t);
    res = await fetch(url, {method: 'POST', headers: {'X-Admin-Token': t}});
  }
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.message || '操作失败');
  return data;
}

function renderHeader() {
  $('#updated').textContent = `${D.mode === 'demo' ? '演示数据 · ' : ''}更新于 ${D.updated_at} (UTC+8)`;
  const s = D.sources || {};
  $('#sources').innerHTML = [['cmc', 'CMC 加密'], ['cmc_rwa', 'CMC TradFi'], ['sec', 'SEC 事件']]
    .map(([k, n]) => `<span class="src ${s[k] ? 'ok' : 'bad'}">${n}</span>`).join('');
  $('#liveDot').classList.toggle('off', !s.cmc);
  $('#stale').hidden = !D.stale; $('#stale').textContent = D.stale || '';
  const ml = D.main_line || {};
  $('#mainText').textContent = ml.text || '暂无明显主线';
  $('#sectorChips').innerHTML = (ml.sectors || []).map(x => `<span class="chip"><small>${esc(x.market)}</small>${esc(x.name)} ${pct(x.pct)}</span>`).join('');
  const hs = D.hotspots || [];
  $('#cAll').textContent = hs.length;
  $('#cCrypto').textContent = hs.filter(h => h.market === 'crypto').length;
  $('#cTradfi').textContent = hs.filter(h => h.market === 'tradfi').length;
}

function renderObservations() {
  const all = (D.short_moves || {}).items || [];
  const kindTag = {stock: '股票', etf: 'ETF', index: '指数', commodity: '商品'};
  const m = D.short_moves || {}, threshold = m.threshold ?? 5;
  $('#shortMeta').textContent = `近1小时涨跌 ≥ ${threshold}% · 更新于 ${m.updated_at || D.updated_at || '—'} · 已生成推广文案，可单条推送 Lark`;
  const row = h => {
    const name = h.market === 'tradfi' ? esc(h.display) : esc(h.pair);
    const tag = h.sector || (h.market === 'tradfi' ? (kindTag[h.kind] || '') : '');
    return `<div class="watch-row" title="${esc(h.driver || '')}"><b>${name}${tag ? ` <span class="tag">${esc(tag)}</span>` : ''}</b><small>1h 异动</small><i>近1h</i><span class="num">${pct(h.pct_1h, 2)}</span>${SNAP ? '' : `<span class="actions"><button class="btn sm" data-preview="${esc(h.id)}">文案</button><button class="btn sm primary" data-push="${esc(h.id)}">推送</button></span>`}</div>`;
  };
  const group = (market, title) => {
    const rows = all.filter(h => h.market === market);
    const empty = market === 'tradfi' && (D.tradfi || {}).empty_reason ? (D.tradfi || {}).empty_reason : '当前暂无 1h 行情异动';
    return `<div class="watch-col"><h5>${title}<em>${rows.length}</em></h5>${rows.length ? rows.slice(0, 6).map(row).join('') : `<span class="muted">${esc(empty)}</span>`}</div>`;
  };
  $('#observations').innerHTML = group('crypto', 'Crypto') + group('tradfi', 'TradFi 美股 / ETF / 商品');
}

function hotspotHtml(h) {
  const stats = [
    ['现价', price(h.price)],
    ['近 1h', h.pct_1h === null || h.pct_1h === undefined ? '—' : pct(h.pct_1h, 2)],
    ['近 24h', pct(h.pct_24h, 2)],
    ['近 3 日', pct(h.pct_3d)],
    ['量能', num(h.vol_ratio) ? (+h.vol_ratio).toFixed(1) + 'x' : '—'],
    ['24h 成交', usd(h.volume_usd)],
  ].map(([k, v]) => `<div><span>${k}</span><b class="num">${v}</b></div>`).join('');
  const pairs = (h.pairs || [h.pair]).map(p => `<span class="pair">${esc(p)}</span>`).join('');
  const news = (h.news || []).map(n => n.url
    ? `<a href="${esc(n.url)}" target="_blank" rel="noreferrer">📰 ${esc(n.title)}<em>${esc(n.source)} · ${esc(n.source_type)}${n.category ? ' · ' + esc(n.category) : ''}</em></a>`
    : `<span>📰 ${esc(n.title)}</span>`).join('');
  const copy = h.copy || {};
  return `<article class="hs ${h.level}" data-id="${esc(h.id)}">
    <div class="hs-head">
      <div class="lv ${h.level}">${h.level}<small>${esc(h.stars)}</small></div>
      <div class="hs-title"><h3>${esc(h.title)}</h3>
        <div class="hs-sub">${pairs}<span class="tag ${h.market}">${esc(h.market_label)}</span><span class="tag">${esc(h.record_type || '事件热点')}</span><span class="tag">${esc(h.signal)}</span><span class="tag">${esc(h.scope)}</span>${h.tradable === false ? '<span class="tag">不在可交易清单</span>' : ''}</div></div>
      <div class="hs-pct"><b>${pct(h.headline_pct ?? h.pct_24h)}</b><small>${h.signal === '板块联动' ? '板块中位数' : h.signal === '连续多日' ? '近 3 日' : '24h'} · 热度 ${h.score}</small></div>
    </div>
    <div class="stats">${stats}</div>
    <div class="why">
      <p><b>${h.sector_sync ? '板块联动' : '个别异动'}</b>${esc(h.sector_line || '—')} → ${esc(h.sector_advice || '')}</p>
      <p><b>一句话解读</b>${esc(h.interpretation)}</p>
    </div>
    ${news ? `<div class="news">${news}</div>` : ''}
    <div class="copy" data-copy>
      <div class="copy-tabs">${[['bd','代理话术'],['tg','TG 中文'],['x','X 英文'],['push','站内触达']].map(([k, n], i) => `<button class="${i ? '' : 'on'}" data-tab="${k}">${n}</button>`).join('')}<button data-copy-btn style="margin-left:auto">复制</button></div>
      <pre>${esc(copy.bd || '')}</pre>
    </div>
    <div class="hs-foot">
      <span class="muted">${esc(h.source)} · ${esc(h.time)} · 规则初判，非最终评级</span>
      <span style="display:flex;gap:6px">
        <button class="btn sm" data-toggle-copy>宣发文案</button>
        <button class="btn sm" data-preview="${esc(h.id)}">卡片预览</button>
        ${SNAP || h.review_required ? '' : `<button class="btn sm primary" data-push="${esc(h.id)}">推送 Lark</button>`}
      </span>
    </div>
  </article>`;
}

function renderHotspots() {
  const rows = (D.hotspots || []).filter(h => (market === 'all' || h.market === market) && (level === 'all' || (level === 'S' ? h.level === 'S' : LV[h.level] >= 2)));
  $('#hotspots').innerHTML = rows.length ? rows.map(hotspotHtml).join('')
    : `<div class="empty">当前没有满足阈值的热点。<br><small>阈值可在 .env 调整（如 CRYPTO_SPIKE_24H）。</small></div>`;
}

function renderSide() {
  const cal = D.calendar || [];
  let html = '', last = '';
  const wd = ['日','一','二','三','四','五','六'];
  for (const e of cal.slice(0, 18)) {
    if (e.date !== last) { const dt = new Date(e.date + 'T00:00:00'); html += `<div class="cal-day">${e.date.slice(5)} 周${wd[dt.getDay()]}${e.date === D.date ? ' · 今天' : ''}</div>`; last = e.date; }
    html += `<div class="cal"><time>${esc(e.time_utc8)}<small>UTC+8</small></time><div><b>${esc(e.title)}</b><small>${esc(e.affected)} · ${esc(e.category)} · ${esc(e.time_et && e.time_et !== '—' ? 'ET ' + e.time_et : e.promotion)}</small></div><span class="stars">${esc(e.stars)}</span></div>`;
  }
  $('#calendar').innerHTML = html || '<div class="muted">暂无排期事件（运行「同步日历」抓取）</div>';

  const r = (D.rankings || {})[rankKey] || [];
  const stockRow = (x, i) => `<div class="rank"><i>${i + 1}</i><b>${esc(x.display || x.symbol)}${x.tag ? ` <span class="tag">${esc(x.tag)}</span>` : ''}<small class="tok">${price(x.price)} · 成交 ${usd(x.volume)}${num(x.tokenized_price) ? ` · 代币均价 ${price(x.tokenized_price)}` : ''}</small></b><span class="num">${pct(x.pct, 2)}</span></div>`;
  const emptyText = rankKey === 'stock_top10' ? ((D.tradfi || {}).empty_reason || '暂无 TradFi 数据') : '暂无数据';
  $('#rankings').innerHTML = r.map((x, i) => rankKey === 'stock_top10' ? stockRow(x, i) : `<div class="rank"><i>${i + 1}</i><b>${esc(x.display || x.symbol)}${x.tag ? ` <span class="tag">${esc(x.tag)}</span>` : ''}</b><span class="num">${rankKey === 'volume_top10' ? usd(x.volume) : pct(x.pct)}</span></div>`).join('') || `<div class="muted">${esc(emptyText)}</div>`;
  $('#rankNote').textContent = rankKey === 'movers_top10' ? '取 24h 成交额前 100 名内，按涨跌幅绝对值排序' : rankKey === 'stock_top10' ? '来源 CMC TradFi（RWA 榜单股票价格）；个股 + ETF，按 24h 涨跌幅绝对值排序；代币均价仅供参考' : 'CMC 24h 成交额';

  const secs = [...((D.crypto || {}).sectors || []).map(s => ({...s, m: 'Crypto'})), ...((D.tradfi || {}).sectors || []).map(s => ({...s, m: '美股'}))]
    .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct)).slice(0, 10);
  const max = Math.max(3, ...secs.map(s => Math.abs(s.pct)));
  $('#sectors').innerHTML = secs.map(s => { const w = Math.min(50, Math.abs(s.pct) / max * 50); const left = s.pct >= 0 ? 50 : 50 - w;
    return `<div class="bar"><span title="${esc(s.m)}">${esc(s.name)} <small class="muted">${esc(s.m)}</small></span><span class="track"><i style="left:${left}%;width:${w}%;background:${s.pct >= 0 ? 'var(--up)' : 'var(--down)'}"></i></span><b>${pct(s.pct)}</b></div>`; }).join('') || '<div class="muted">暂无数据</div>';

  const eventHtml = items => (items || []).slice(0, 4).map(n => `<div class="nitem"><a href="${esc(n.url)}" target="_blank" rel="noreferrer">${esc(n.title)}</a><small>${(n.pairs || []).map(esc).join(' / ')} · ${esc(n.source)} · ${esc(n.source_type === '官方' ? '已确认' : '待确认')} · ${esc(n.time_display || '')}${n.category ? ' · ' + esc(n.category) : ''}</small></div>`).join('') || '<div class="muted">暂无关联资讯</div>';
  $('#cryptoNews').innerHTML = eventHtml(D.crypto_news);
  $('#tradfiNews').innerHTML = eventHtml(D.tradfi_news);
}

function renderRecords() {
  const rows = D.daily_records || [];
  const size = 10, pages = Math.max(1, Math.ceil(rows.length / size));
  recPage = Math.min(recPage, pages);
  $('#records').innerHTML = rows.slice((recPage - 1) * size, recPage * size).map(r => `<tr><td class="num">${esc(String(r.first_seen).slice(-5))}</td><td class="t">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a>` : esc(r.title)}</td><td>${esc(r.pair)}</td><td>${esc(r.market_label)}</td><td>${esc(r.signal)}</td><td>${esc(r.level)} ${esc(r.stars)}</td><td class="num">${pct(r.pct_24h)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">今日暂无记录</td></tr>';
  $('#page').textContent = `${recPage}/${pages}`; $('#recCount').textContent = `共 ${rows.length} 条`;
  $('#prev').disabled = recPage <= 1; $('#next').disabled = recPage >= pages;
}

function renderUsOpen() {
  const u = D.us_open || {};
  if (!u.rows) { $('#usopenPanel').hidden = true; return; }
  $('#usopenPanel').hidden = false;
  const push = u.final || u.preview || {};
  $('#usPhase').textContent = u.phase || '—';
  const missing = (u.missing || []).length ? ` · 未取到：${u.missing.join('、')}` : '';
  const health = (u.sources || []).map(h => `${h.label}${h.ok ? '✓' : h.cooling_min ? `冷却${h.cooling_min}分` : '✗'}`).join(' ');
  $('#usMeta').textContent = `重点美股币对 ${u.rows.length} 个 · 美东 9:30 开盘（北京 ${u.open || '—'}）采集至 ${u.end || '—'} · 报价 ${u.quoted_at || '—'}${u.pushed_at ? ' · 已推送 ' + u.pushed_at : ''}${missing}${health ? ' · 来源 ' + health : ''}`;
  $('#usTitle').textContent = (u.final ? '已定格 · ' : '实时预览 · ') + (push.title || '美股异动');
  $('#usText').textContent = push.text || '暂无明显异动';
  $('#usTop').innerHTML = (push.top || []).map((r, i) => `<div class="us-top"><i>${i + 1}</i><b>${esc(r.name)}<small>${esc(r.symbol)}</small></b><span class="num">${price(r.price)}</span><span class="num">${pct(r.pct, 2)}${r.mismatch ? ` <span title="${esc(r.check_source)} 报价 ${price(r.check_price)}，相差 ${r.check_diff.toFixed(1)}%">⚠️</span>` : ''}</span></div>`).join('') || '<span class="muted">暂无数据</span>';
  $('#usTiles').innerHTML = u.rows.map(r => `<div class="us-tile ${r.us_session ? '' : 'off'}" title="${esc(r.name)} · ${esc(r.source || '未取到')}${r.us_session ? '' : ' · 不参与开盘排名'}${r.since_open !== null && r.since_open !== undefined ? ' · 开盘后 ' + r.since_open.toFixed(2) + '%' : ''}"><b>${esc(r.symbol)}</b><span class="num">${r.price ? pct(r.pct, 2) : '<span class="muted">未取到</span>'}</span><small>${esc(r.name)}</small><small class="num">${r.price ? price(r.price) : ''}</small></div>`).join('');
}
$('#usRefresh').onclick = async e => {
  const b = e.target, old = b.textContent; b.disabled = true; b.textContent = '刷新中…';
  try { const r = await post('/api/usopen/refresh'); D.us_open = r.us_open; renderUsOpen(); } catch (err) { alert(err.message); }
  finally { b.disabled = false; b.textContent = old; }
};

function render() { if (!D) return; renderHeader(); renderUsOpen(); renderObservations(); renderHotspots(); renderSide(); renderRecords(); }

/* ---------- Lark 卡片预览（与机器人实际发出的卡片同源） ---------- */
function mdToHtml(s) {
  return esc(s).replace(/&lt;font color=&#39;(\w+)&#39;&gt;(.*?)&lt;\/font&gt;/g, (m, c, t) => `<span class="${c === 'green' ? 'up' : c === 'red' ? 'down' : 'muted'}">${t}</span>`)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function cardHtml(c) {
  const h = c.header || {}, els = (c.body || {}).elements || [];
  const walk = e => e.tag === 'markdown' ? `<p>${mdToHtml(e.content)}</p>`
    : e.tag === 'hr' ? '<hr>'
    : e.tag === 'collapsible_panel' ? `<details><summary>${mdToHtml(e.header.title.content)}</summary>${(e.elements || []).map(walk).join('')}</details>`
    : e.tag === 'column_set' ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${e.columns.map(col => `<div>${col.elements.map(walk).join('')}</div>`).join('')}</div>` : '';
  return `<div class="lk-head ${esc(h.template)}">${esc(h.title && h.title.content)}${h.subtitle ? `<small>${esc(h.subtitle.content)}</small>` : ''}</div><div class="lk-body">${els.map(walk).join('')}</div>`;
}
async function preview(id) {
  let c;
  if (SNAP) { $('#cardView').innerHTML = '<div class="lk-body"><p>公开页不提供卡片预览。</p></div>'; }
  else { c = await (await fetch('/api/card?id=' + encodeURIComponent(id))).json(); $('#cardView').innerHTML = cardHtml(c); }
  $('#modalPush').hidden = !!SNAP; $('#modalPush').dataset.target = id; $('#modal').hidden = false;
}

async function push(id, btn) {
  const shortMove = id.startsWith('short1h-');
  const url = id === 'morning' ? '/api/push/morning' : id === 'usopen' ? '/api/push/usopen' : shortMove ? '/api/push/short-move?id=' + encodeURIComponent(id) : '/api/push/hotspot?id=' + encodeURIComponent(id);
  const message = id === 'morning' ? '确认推送早报到 Lark 群？' : id === 'usopen' ? '确认把「美股异动」推送到 Lark 群？' : shortMove ? '确认把这条 1h 行情异动推送到 Lark 群？' : '确认把这条热点推送到 Lark 群？';
  if (!confirm(message)) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = '推送中…';
  try { const r = await post(url); btn.textContent = '已推送'; alert(r.message || '已推送'); }
  catch (e) { btn.textContent = old; alert('推送失败：' + e.message); }
  finally { btn.disabled = false; }
}

document.addEventListener('click', async ev => {
  const t = ev.target;
  const seg = t.closest('[data-market],[data-level],[data-rank]');
  if (seg) {
    const box = seg.parentElement; box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === seg));
    if (seg.dataset.market) market = seg.dataset.market;
    if (seg.dataset.level) level = seg.dataset.level;
    if (seg.dataset.rank) { rankKey = seg.dataset.rank; renderSide(); return; }
    renderHotspots(); return;
  }
  if (t.closest('[data-toggle-copy]')) { t.closest('.hs').querySelector('[data-copy]').classList.toggle('open'); return; }
  const tab = t.closest('[data-tab]');
  if (tab) {
    const card = tab.closest('.hs'), h = (D.hotspots || []).find(x => x.id === card.dataset.id);
    tab.parentElement.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab));
    card.querySelector('pre').textContent = (h.copy || {})[tab.dataset.tab] || ''; return;
  }
  if (t.closest('[data-copy-btn]')) {
    const text = t.closest('[data-copy]').querySelector('pre').textContent;
    try { await navigator.clipboard.writeText(text); t.textContent = '已复制'; setTimeout(() => t.textContent = '复制', 1200); } catch (e) { alert('复制失败，请手动选择文本'); }
    return;
  }
  const pv = t.closest('[data-preview]'); if (pv) { preview(pv.dataset.preview); return; }
  const pb = t.closest('[data-push]'); if (pb) { push(pb.dataset.push, pb); return; }
  const ap = t.closest('[data-post]');
  if (ap) {
    if (ap.dataset.confirm && !confirm(ap.dataset.confirm)) return;
    const old = ap.textContent; ap.disabled = true; ap.textContent = '处理中…';
    try { const r = await post(ap.dataset.post); alert(r.message || '完成'); } catch (e) { alert(e.message); }
    finally { ap.disabled = false; ap.textContent = old; }
  }
});
$('#closeModal').onclick = () => $('#modal').hidden = true;
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
$('#modalPush').onclick = e => push(e.target.dataset.target, e.target);
$('#prev').onclick = () => { recPage--; renderRecords(); };
$('#next').onclick = () => { recPage++; renderRecords(); };

async function load(refresh = false) {
  const b = $('#refresh'); b.disabled = true; b.textContent = '更新中…';
  try { D = refresh ? (await post('/api/refresh')).dashboard : await (await fetch('/api/dashboard')).json(); render(); }
  catch (e) { if (refresh) alert('刷新失败：' + e.message); }
  finally { b.disabled = false; b.textContent = '刷新'; }
}

if (SNAP) { $('#actions').innerHTML = '<span class="src">公开只读快照</span>'; document.querySelector('.us-actions')?.remove(); render(); }
else { $('#refresh').onclick = () => load(true); load(); setInterval(() => load(false), 60000); }
</script>
