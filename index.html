<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市场热点监控</title>
<style>
[hidden]{display:none!important}
:root{
  --bg:#0a0c0f;--panel:#111419;--panel2:#161a20;--panel3:#1b2027;
  --line:#232933;--line2:#1a1f26;
  --text:#e9ecf1;--muted:#8d95a3;--dim:#616a78;
  --accent:#f0b90b;--accent2:#ffd666;
  --up:#16c784;--down:#ea3943;
  --s:#ff5a5f;--a:#f5a524;--b:#6b8afd;
  --r:10px;--gap:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.dim{color:var(--dim)}
.shell{max-width:1680px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:11px 13px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:20px;flex-wrap:wrap;min-width:0}
.hd h2{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.hd small{color:var(--dim);font-size:10px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto;text-align:right}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--panel3);color:var(--muted);font-size:10px;font-weight:500;white-space:nowrap}
.tag.ai{background:#1d2b3f;color:#8fb8ff}
.tag.up{background:#0f2a20;color:var(--up)}.tag.down{background:#2d1418;color:var(--down)}
.empty{color:var(--dim);font-size:12px;padding:10px 0;text-align:center}
.empty.sm{padding:5px 0;font-size:11px;text-align:left}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:16px;letter-spacing:-.01em}
.brand .meta{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up)}
.dot.off{background:var(--down);box-shadow:none}
.src{padding:1px 6px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--dim)}
.src.ok{color:var(--up);border-color:#1d4a37}.src.bad{color:var(--down);border-color:#4a1d22}
.src.wait{color:var(--accent);border-color:#5a4410}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#39414e}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1400}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sm{padding:4px 8px;font-size:10px}
.banner{padding:7px 12px;border:1px solid #5a4410;background:#1f1806;border-radius:8px;color:var(--accent2);font-size:11px}

/* 宏观一句话 */
.macro{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.macro .box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.macro .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--panel3)}
.macro p{margin:3px 0 0;font-size:13px;line-height:1.55;color:var(--text)}
.macro .label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.macro .stats{display:flex;gap:12px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line2);flex-wrap:wrap}
.macro .stats span{font-size:11px;color:var(--dim)}
.macro .stats b{color:var(--text);font-weight:600;margin-left:3px}

/* 四块涨幅 Top5 */
.tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.rank{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:7px;align-items:baseline;padding:3px 0;font-size:12px}
.rank+.rank{border-top:1px solid var(--line2)}
.rank i{font-style:normal;color:var(--dim);font-size:10px}
.rank b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rank b em{font-style:normal;color:var(--dim);font-size:10px;margin-left:4px}
.rank .v{font-weight:700;text-align:right}

/* 主体两栏 */
#hotspots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:start}
.main{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);align-items:start;min-width:0}
.main>.col{display:contents}
.main>.col>.panel{grid-column:span 6;min-width:0}
#eventsPanel{order:1;grid-column:span 12}
#newsPanel{order:2;grid-column:span 12}
#usPanel{order:3}#projectsPanel{order:4}
#shortMovePanel{order:5}
#calendarPanel{order:7;grid-column:span 5}
#calendarPanel{grid-column:span 6}

/* 美股开盘异动 */
.us-top{display:grid;grid-template-columns:16px minmax(0,1fr) auto 58px;gap:8px;align-items:baseline;font-size:12px;padding:4px 0;min-width:0}
.us-top+.us-top{border-top:1px solid var(--line2)}
.us-top i{font-style:normal;color:var(--dim);font-size:10px}
.us-top b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.us-top b em{font-style:normal;color:var(--dim);font-size:10px;margin-left:4px}
.us-top .p{white-space:nowrap}
.us-top .p{color:var(--muted);font-variant-numeric:tabular-nums}
.us-top .v{font-weight:700;min-width:58px;text-align:right}
.us-news{grid-column:2/-1;display:flex;gap:5px 10px;flex-wrap:wrap;color:var(--dim);font-size:11px;line-height:1.45;padding:0 0 5px}
.us-news a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.us-news a:hover{text-decoration:underline}
.us-headline{background:var(--panel2);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.6;font-weight:600;margin-bottom:8px;overflow-wrap:anywhere}
.us-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.us-cell{padding:4px 6px;border-radius:5px;background:var(--panel2);font-size:11px;min-width:0}
.us-cell b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.us-cell span{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.us-cell.off{opacity:.45}
.us-miss{margin-top:6px;font-size:10px;color:var(--dim);overflow-wrap:anywhere}
.session-tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.session-tabs button.on{background:var(--accent);color:#17120a}
.session-note{font-size:11px;color:var(--muted);margin:6px 0}
.session-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:11px}
.session-table th,.session-table td{padding:5px 7px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.session-table th:first-child,.session-table td:first-child{text-align:left}
.session-table td:last-child{white-space:normal;max-width:150px;color:var(--muted)}
.session-scroll{max-height:460px;overflow:auto}

/* 热点卡片 */
.hs{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);padding:9px 11px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.hs.S{border-left-color:var(--s)}.hs.A{border-left-color:var(--a)}.hs.B{border-left-color:var(--b)}
.hs-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;min-width:0}
.lv{width:34px;text-align:center;border-radius:6px;padding:3px 0 2px;font-weight:800;font-size:13px;line-height:1.1}
.lv small{display:block;font-size:8px;font-weight:600;letter-spacing:-1px}
.lv.S{background:#3a1416;color:#ff9b9e}.lv.A{background:#3a2a0c;color:#ffc56b}.lv.B{background:#18203d;color:#a9baff}
.hs h3{margin:0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.hs-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.pair{padding:1px 7px;border-radius:5px;background:#2a2206;border:1px solid #5a4410;color:var(--accent2);font-weight:700;font-size:11px}
.hs-pct{text-align:right;white-space:nowrap}
.hs-pct b{font-size:18px;display:block;line-height:1.1}
.hs-pct small{color:var(--dim);font-size:10px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line2);border-radius:6px;overflow:hidden}
.stats div{background:var(--panel2);padding:5px 7px;min-width:0}
.stats div>span{display:block;font-size:9px;color:var(--dim)}
.stats b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.why{display:grid;gap:4px;font-size:12px;color:#bcc4cf;line-height:1.5}
.why p{margin:0;min-width:0;overflow-wrap:anywhere}
.why b{color:var(--text);margin-right:5px;font-weight:600}
.news a{display:block;font-size:11.5px;color:#9fb4ff;text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:1px 0}
.news a:hover{text-decoration:underline}
.news em{font-style:normal;color:var(--dim);margin-left:5px;font-size:10px}
.news.src{border-left:2px solid #3a4454;padding-left:7px;margin-top:1px}
.news.src a{color:#8fd0b6;white-space:normal;text-overflow:clip}
.news i.tier{font-style:normal;color:var(--dim);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:5px}
.sent{font-weight:700;margin-right:5px}
.sent.up{color:var(--up)}.sent.down{color:var(--down)}
.tag.ok{color:#7ee0b0;border-color:#2c5a46;background:#102a20}
.hs-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:7px;border-top:1px solid var(--line2);font-size:10px;color:var(--dim)}
.hs{padding:9px;gap:7px}
.hs h3{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.hs .lv{width:28px;font-size:11px}
.hs .hs-top{gap:6px}
.hs .hs-pct b{font-size:15px}
.hs .hs-meta{gap:3px;margin-top:3px}
.hs .hs-brief{font-size:11px;color:#c2cad4;line-height:1.5;min-height:2.8em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.hs .hs-figures{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.hs .hs-source{font-size:10px;color:#9fb4ff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs .hs-foot{padding-top:5px}.hs .hs-foot>span:last-child{display:flex;gap:4px;flex-wrap:wrap}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:11px}
.pager[hidden]{display:none}
.move-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.move-row{border:1px solid var(--line2);border-radius:7px;background:var(--panel2);padding:8px 10px;min-width:0}
.move-row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.move-row b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.move-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.gmenu{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.55);min-width:220px}
.gmenu h4{margin:2px 6px 6px;font-size:10px;color:var(--dim);font-weight:600}
.gmenu button{display:block;width:100%;text-align:left;font:inherit;font-size:12px;color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 9px;cursor:pointer}
.gmenu button:hover{background:#1b2230;border-color:#39414e}
.gmenu button small{display:block;color:var(--dim);font-size:10px;margin-top:2px}
.gmenu button .rec{color:var(--accent2);font-size:10px;margin-left:5px}
.gmenu button .warn{color:#e0a34a;font-size:10px;margin-left:5px}
.copy{display:none}.copy.open{display:block;margin-top:2px}
.copy-tabs{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.copy-tabs button{font:inherit;font-size:10px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:5px;padding:3px 8px;cursor:pointer}
.copy-tabs button.on{color:var(--text);border-color:#39414e;background:var(--panel2)}
.copy pre{margin:0;white-space:pre-wrap;font:inherit;font-size:11.5px;line-height:1.65;background:var(--panel2);border-radius:6px;padding:9px 11px;color:#d4dae3}

/* 行情提示 */
.watch{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.wcol{display:grid;gap:1px;align-content:start;min-width:0}
.wcol h5{margin:0 0 3px;font-size:10px;letter-spacing:.05em;color:var(--muted);display:flex;gap:5px;align-items:center}
.wcol h5 em{font-style:normal;color:var(--dim);font-weight:400}
.wrow{display:grid;grid-template-columns:minmax(0,auto) 1fr 40px 60px;gap:7px;align-items:baseline;padding:3px 6px;border-radius:5px;font-size:11.5px}
.wrow:nth-child(even){background:var(--panel2)}
.wrow b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wrow .sig{color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.wrow .win{color:var(--muted);font-size:10px;text-align:right}
.wrow .v{text-align:right;font-weight:700}

/* 项目动态 */
.proj{display:grid;gap:1px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:6px;border-radius:6px;align-items:start}
.prow:nth-child(even){background:var(--panel2)}
.prow .dot2{width:7px;height:7px;border-radius:50%;margin-top:5px}
.prow .dot2.good{background:var(--up)}.prow .dot2.bad{background:var(--down)}.prow .dot2.mid{background:var(--dim)}
.prow b{font-size:12px;font-weight:600}
.prow b em{font-style:normal;color:var(--dim);font-size:10px;margin-left:4px}
.prow p{margin:2px 0 0;font-size:11.5px;line-height:1.5;color:#bcc4cf}
.prow .links{margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.prow .links a{font-size:10px;color:#9fb4ff;text-decoration:none}
.prow .links a:hover{text-decoration:underline}
.prow .v{font-weight:700;font-size:12px;white-space:nowrap}

/* 紧凑日历 */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal-week{font-size:10px;color:var(--dim);padding:2px}
.cal-cell{height:30px;border:1px solid transparent;background:var(--panel2);color:var(--text);border-radius:5px;font:inherit;font-size:11px;cursor:pointer;position:relative}
.cal-cell:disabled{background:transparent;cursor:default}.cal-cell.has{border-color:#6b5019}.cal-cell.selected{background:#3b2d0e;color:var(--accent2)}
.cal-cell.has::after{content:'';position:absolute;bottom:2px;left:calc(50% - 2px);width:4px;height:4px;background:var(--accent);border-radius:50%}
.cal-detail{margin-top:7px;border-top:1px solid var(--line2);padding-top:5px;max-height:110px;overflow:auto}
.cal-detail div{font-size:11px;padding:3px 0;display:flex;gap:6px}.cal-detail time{color:var(--dim);flex:none}
.stars{color:var(--accent);font-size:10px;white-space:nowrap}

/* 板块条 */
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 52px;gap:7px;align-items:center;font-size:11.5px;padding:2px 0}
.bar>span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar>span:first-child em{font-style:normal;color:var(--dim);font-size:10px;margin-left:3px}
.track{height:5px;background:var(--panel2);border-radius:3px;position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-radius:3px}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar b{text-align:right;font-weight:600}

/* 资讯 */
.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.nitem{padding:8px 10px;font-size:11.5px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);min-width:0}
.nitem+.nitem{border-top:1px solid var(--line2)}
.nitem a{text-decoration:none;display:block;line-height:1.45}
.nitem a:hover{color:var(--accent2)}
.nitem small{color:var(--dim);font-size:10px;display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .news-head{display:flex;align-items:start;justify-content:space-between;gap:7px}
.nitem .news-head>a,.nitem .news-head>span{min-width:0;flex:1;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.nitem .news-head button{flex:none}
.nitem .news-head .btn{color:var(--accent2);border-color:#705819}
.nitem details{margin-top:6px;color:var(--muted)}
.nitem details summary{cursor:pointer;color:var(--accent2)}
.nitem details p{margin:6px 0;line-height:1.5}
.nitem details pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);margin:5px 0 8px}

/* 记录表 */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 7px;border-bottom:1px solid var(--line);font-size:10px}
td{padding:5px 7px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.t{white-space:normal;min-width:200px}
/* 记录表：名称列吃掉富余宽度，其余列贴紧，避免整行被拉散 */
.records table{table-layout:fixed}
.records th:first-child,.records td:first-child{width:76px}
.records th:nth-child(2),.records td:nth-child(2){width:auto}
.records th:nth-child(n+3),.records td:nth-child(n+3){width:110px}
.records td:nth-child(2){overflow:hidden;text-overflow:ellipsis}
td a{text-decoration:none}td a:hover{color:var(--accent2)}
.pager{display:flex;justify-content:flex-end;gap:7px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}

/* 过滤器 */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{font:inherit;font-size:11px;border:0;background:transparent;color:var(--muted);padding:3px 9px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--panel3);color:var(--text)}
.seg button em{font-style:normal;color:var(--dim);margin-left:4px;font-size:10px}

/* 弹窗 */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .box{width:min(560px,100%);max-height:88vh;overflow:auto;background:#1b1f26;border-radius:11px;border:1px solid #2d343e}
.lk-head{padding:11px 15px;border-radius:11px 11px 0 0;font-weight:700;font-size:13px}
.lk-head small{display:block;font-weight:400;opacity:.85;font-size:11px;margin-top:2px}
.lk-head.green{background:#15543a}.lk-head.red{background:#5e1d22}.lk-head.purple{background:#412a74}
.lk-body{padding:11px 15px;display:grid;gap:9px;font-size:12.5px}
.lk-body p{margin:0;white-space:pre-wrap;line-height:1.6}
.lk-body details{border:1px solid #333a44;border-radius:6px;padding:6px 9px}
.lk-body summary{cursor:pointer}
.lk-body hr{border:0;border-top:1px solid #333a44;margin:1px 0}
.modal .foot{display:flex;justify-content:flex-end;gap:7px;padding:9px 15px;border-top:1px solid #2d343e}

@media (max-width:1400px){.tops{grid-template-columns:repeat(2,minmax(0,1fr))}.us-grid{grid-template-columns:repeat(5,minmax(0,1fr))}#hotspots{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
const SNAP = window.__SNAPSHOT__ || null;
let D = SNAP, market = 'all', recPage = 1, hsPage = 1, calOffset = 0, calSelected = '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v;
const pct = (v, d = 1) => { const n = num(v); return n === null ? '<span class="dim">—</span>' : `<span class="num ${n > 0 ? 'up' : n < 0 ? 'down' : ''}">${n > 0 ? '+' : ''}${n.toFixed(d)}%</span>`; };
const price = v => { const n = num(v); if (n === null || n === 0) return '—'; return n >= 1000 ? '$' + n.toLocaleString('en-US', {maximumFractionDigits: 0}) : n >= 10 ? '$' + n.toFixed(2) : n >= 1 ? '$' + n.toFixed(3) : '$' + n.toPrecision(4); };
const usd = v => { const n = num(v); if (!n) return '—'; for (const [s, u] of [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']]) if (n >= s) return '$' + (n / s).toFixed(2) + u; return '$' + n.toFixed(0); };

function token() { try { return localStorage.getItem('hotspot_admin_token') || ''; } catch (e) { return ''; } }
async function post(url) {
  let res = await fetch(url, {method: 'POST', headers: {'X-Admin-Token': token()}});
  if (res.status === 401) {
    const t = prompt('请输入管理口令（服务器 .env 中的 ADMIN_TOKEN）');
    if (!t) throw new Error('未输入口令');
    try { localStorage.setItem('hotspot_admin_token', t); } catch (e) {}
    res = await fetch(url, {method: 'POST', headers: {'X-Admin-Token': t}});
  }
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.message || '操作失败');
  return data;
}

/* ---------- 顶栏 ---------- */
function renderHeader() {
  const s = D.sources || {};
  $('#updated').textContent = `${D.mode === 'demo' ? '演示数据 · ' : ''}${D.updated_at} (UTC+8)`;
  const rep = D.daily_report || {};
  const chips = [['cmc', 'CMC'], ['cmc_rwa', 'CMC TradFi'], ['sec', 'SEC']]
    .map(([k, n]) => `<span class="src ${s[k] ? 'ok' : 'bad'}">${n}</span>`);
  const flash = D.news_sources || [];
  if (flash.length) {
    const live = flash.filter(f => !f.cooling_min).length;
    chips.push(`<span class="src ${live ? 'ok' : 'bad'}" title="${esc(flash.map(f => f.name + (f.cooling_min ? `(冷却${f.cooling_min}分)` : '')).join(' / '))}">快讯 ${live}/${flash.length}</span>`);
  }
  const aiUsed = rep.ai_used || (D.hotspots || []).some(h => h.copy_ai || (h.move_reason || {}).ai);
  chips.push(`<span class="src ${aiUsed ? 'ok' : 'wait'}">AI ${aiUsed ? '已用' : '未用'}</span>`);
  $('#sources').innerHTML = chips.join('');
  $('#liveDot').classList.toggle('off', !s.cmc);
  $('#banner').hidden = !D.stale;
  $('#banner').textContent = D.stale || '';
}

/* ---------- 1. 宏观 ---------- */
function renderMacro() {
  const rep = D.daily_report || {};
  const macro = rep.macro || {};
  const m = D.crypto?.metrics || {};
  const tf = (D.tradfi?.cross_assets || []).slice(0, 3);
  const box = (ico, label, line, stats) => `<div class="panel pad box">
      <div class="ico">${ico}</div>
      <div>
        <div class="label">${label}${line?.ai ? '<span class="tag ai">AI</span>' : line ? '<span class="tag">规则</span>' : ''}</div>
        <p>${esc(line?.text || '点「生成日报」后显示市场一句话总结')}</p>
        ${stats ? `<div class="stats">${stats}</div>` : ''}
      </div></div>`;
  const cryptoStats = m.market_cap ? `
    <span>总市值<b>${usd(m.market_cap)}</b></span>
    <span>24h 成交<b>${usd(m.volume)}</b></span>
    <span>BTC 占比<b>${num(m.btc_dominance)?.toFixed(1) ?? '—'}%</b></span>` : '';
  const tfStats = tf.length ? tf.map(c => `<span>${esc(c.name)}<b>${pct(c.pct)}</b></span>`).join('') : '';
  $('#macro').innerHTML = box('🪙', 'Crypto 宏观', macro.crypto, cryptoStats) + box('🏛', 'TradFi 宏观', macro.tradfi, tfStats);
}

/* ---------- 2. 四块涨幅 Top5 ---------- */
function renderTops() {
  const rep = D.daily_report || {};
  const blocks = (rep.moves && rep.moves.length) ? rep.moves : [
    {key: 'crypto_day_top5', title: 'Crypto · 日涨幅 Top5', window: '24h'},
    {key: 'crypto_week_top5', title: 'Crypto · 周涨幅 Top5', window: '7d'},
    {key: 'tradfi_day_top5', title: '美股 · 日涨幅 Top5', window: '24h'},
    {key: 'tradfi_week_top5', title: '美股 · 周涨幅 Top5', window: '7d'},
  ];
  $('#tops').innerHTML = blocks.map(b => {
    const rows = b.rows || (D.rankings || {})[b.key] || [];
    const body = rows.length ? rows.slice(0, 5).map((r, i) =>
      `<div class="rank"><i>${i + 1}</i><b>${esc(r.symbol)}${r.display && r.display !== r.symbol ? `<em>${esc(String(r.display).replace(r.symbol, '').trim())}</em>` : ''}</b><span class="v">${pct(r.pct, 2)}</span></div>`
    ).join('') : '<div class="empty">暂无上涨标的</div>';
    return `<section class="panel pad"><div class="hd"><h2>${esc(b.title)}</h2><small>${b.window === '7d' ? '滚动 7 天' : '滚动 24h'}</small></div>${body}</section>`;
  }).join('');
}

/* ---------- 3a. 美股开盘异动 ---------- */
function renderUsOpen() {
  const u = D.us_open || {};
  if (!u.sessions) { $('#usPanel').hidden = true; return; }
  $('#usPanel').hidden = false;
  const sessions = u.sessions, keys = ['pre','mid','close'];
  window.usSessionTab = keys.includes(window.usSessionTab) ? window.usSessionTab : 'mid';
  const labels = {pre:'盘前',mid:'盘中',close:'收盘'};
  const active = window.usSessionTab, snap = (sessions.phases || {})[active];
  // US_SESSION_HISTORY_V3
  // US_MID_SNAPSHOT_STATUS_V2
  const phaseStatus = snap?.status === 'unavailable' ? '未取得有效快照' : snap?.status === 'partial' ? '已定格（部分数据）' : snap ? '已定格' : active === 'mid' && sessions.mid_pending ? '等待延迟报价' : '待采集';

function renderCalendar() {
  const today = D.date || new Date(Date.now() + 8 * 3600000).toISOString().slice(0,10);
  const [year, month] = today.split('-').map(Number);
  const first = new Date(Date.UTC(year, month - 1 + calOffset, 1));
  const yy = first.getUTCFullYear(), mm = first.getUTCMonth(), days = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate();
  const pad = (n) => String(n).padStart(2, '0');
  const events = D.calendar || [];
  const dates = new Set(events.map(e => e.date));
  if (!calSelected || !calSelected.startsWith(`${yy}-${pad(mm+1)}`)) {
    calSelected = dates.has(today) && calOffset === 0 ? today : events.find(e => e.date.startsWith(`${yy}-${pad(mm+1)}`))?.date || `${yy}-${pad(mm+1)}-01`;
  }
  const blanks = (first.getUTCDay() + 6) % 7;
  let grid = ['一','二','三','四','五','六','日'].map(x => `<span class="cal-week">${x}</span>`).join('');
  grid += Array.from({length:blanks}, () => '<button class="cal-cell" disabled></button>').join('');
  grid += Array.from({length:days}, (_,i) => {
    const date = `${yy}-${pad(mm+1)}-${pad(i+1)}`;
    return `<button class="cal-cell ${dates.has(date) ? 'has' : ''} ${date === calSelected ? 'selected' : ''}" data-cal-date="${date}" title="${esc(date)}">${i+1}</button>`;
  }).join('');
  const detail = events.filter(e => e.date === calSelected).slice(0, 4).map(e => `<div><time>${esc(e.time_utc8 || '待定')}</time><span>${esc(e.title)} · ${esc(e.affected || '')}</span></div>`).join('');
  $('#calendar').innerHTML = `<div class="cal-head"><span>${yy} 年 ${mm+1} 月</span><span><button class="btn sm" data-cal-step="-1">‹</button> <button class="btn sm" data-cal-step="1">›</button></span></div><div class="cal-grid">${grid}</div><div class="cal-detail"><span class="dim">${esc(calSelected)} · UTC+8</span>${detail || '<div class="dim">当日暂无事件</div>'}</div>`;
}

/* ---------- Lark 卡片预览 ---------- */
function mdToHtml(s) {
  return esc(s).replace(/&lt;font color=&#39;(\w+)&#39;&gt;(.*?)&lt;\/font&gt;/g, (m, c, t) => `<span class="${c === 'green' ? 'up' : c === 'red' ? 'down' : 'dim'}">${t}</span>`)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function cardHtml(c) {
  const h = c.header || {}, els = (c.body || {}).elements || [];
  const walk = e => e.tag === 'markdown' ? `<p>${mdToHtml(e.content)}</p>`
    : e.tag === 'hr' ? '<hr>'
    : e.tag === 'collapsible_panel' ? `<details><summary>${mdToHtml(e.header.title.content)}</summary>${(e.elements || []).map(walk).join('')}</details>`
    : e.tag === 'column_set' ? `<div style="display:grid;grid-template-columns:repeat(${e.columns.length},1fr);gap:10px">${e.columns.map(col => `<div>${col.elements.map(walk).join('')}</div>`).join('')}</div>` : '';
  return `<div class="lk-head ${esc(h.template)}">${esc(h.title && h.title.content)}${h.subtitle ? `<small>${esc(h.subtitle.content)}</small>` : ''}</div><div class="lk-body">${els.map(walk).join('')}</div>`;
}
async function preview(id) {
  if (SNAP) { $('#cardView').innerHTML = '<div class="lk-body"><p>公开页不提供卡片预览。</p></div>'; }
  else { $('#cardView').innerHTML = cardHtml(await (await fetch('/api/card?id=' + encodeURIComponent(id))).json()); }
  $('#modalPush').hidden = !!SNAP; $('#modalPush').dataset.target = id; $('#modal').hidden = false;
}
/* 推送前先选群：美股触达群 / 热点事件运营群 */
function groupList() {
  return (D.lark_groups || []).length ? D.lark_groups
    : [{ key: 'usstock', name: '美股触达群', hint: '美股开盘异动、个股消息面', configured: false },
       { key: 'hotspot', name: '热点事件运营群', hint: 'Crypto / 美股事件热点、日报', configured: false }];
}
function recommended(id) {
  if (id.startsWith('ussession:')) return 'usstock';
  if (id === 'usopen') return 'usstock';
  if (id === 'morning') return 'hotspot';
  if (id.startsWith('news:')) {
    const n = (D.news || []).find(x => x.id === id.slice(5));
    return n && n.market === 'tradfi' ? 'usstock' : 'hotspot';
  }
  const h = (D.hotspots || []).find(x => x.id === id);
  return h && h.market === 'tradfi' ? 'usstock' : 'hotspot';
}
function closeGroupMenu() { const m = $('#gmenu'); if (m) m.remove(); }
function openGroupMenu(btn, id) {
  closeGroupMenu();
  const rec = recommended(id);
  const box = document.createElement('div');
  box.className = 'gmenu'; box.id = 'gmenu';
  const groups = id.startsWith('news:') ? groupList().filter(g => g.configured) : groupList();
  box.innerHTML = '<h4>推送到哪个群？</h4>' + (groups.length ? groups.map(g => `
    <button data-group="${esc(g.key)}">${esc(g.name)}${g.key === rec ? '<span class="rec">建议</span>' : ''}${g.configured ? '' : '<span class="warn">未配置 · 发默认群</span>'}
      <small>${esc(g.hint || '')}</small></button>`).join('') : '<h4>尚未配置目标群，未发送</h4>');
  document.body.appendChild(box);
  const r = btn.getBoundingClientRect();
  box.style.top = Math.min(r.bottom + 6, innerHeight - box.offsetHeight - 10) + 'px';
  box.style.left = Math.max(10, Math.min(r.left, innerWidth - box.offsetWidth - 10)) + 'px';
  box.addEventListener('click', ev => {
    const opt = ev.target.closest('[data-group]');
    if (opt) { closeGroupMenu(); push(id, btn, opt.dataset.group); }
  });
}
async function push(id, btn, group) {
  const isSession = id.startsWith('ussession:');
  const isNews = id.startsWith('news:');
  const sep = id === 'morning' || id === 'usopen' ? '?' : '&';
  const base = id === 'morning' ? '/api/push/morning' : isSession ? '/api/push/us-session?phase=' + encodeURIComponent(id.slice(10)) : id === 'usopen' ? '/api/push/usopen' : isNews ? '/api/push/news?id=' + encodeURIComponent(id.slice(5)) : '/api/push/hotspot?id=' + encodeURIComponent(id);
  const url = base + (group ? sep + 'group=' + encodeURIComponent(group) : '');
  const what = id === 'morning' ? '日报' : isSession ? '当前时段的已定格快照' : id === 'usopen' ? '「美股异动」' : isNews ? '这条资讯' : '这条热点';
  const gname = (groupList().find(g => g.key === group) || {}).name || 'Lark 群';
  if (!confirm(`确认把${what}推送到${gname}？`)) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = '推送中…';
  try { const r = await post(url); btn.textContent = '已推送'; alert(r.message || '已推送'); }
  catch (e) { btn.textContent = old; alert('推送失败：' + e.message); }
  finally { btn.disabled = false; }
}

document.addEventListener('click', async ev => {
  const t = ev.target;
  const usTab = t.closest('[data-us-session]'); if (usTab) { window.usSessionTab = usTab.dataset.usSession; renderUsOpen(); return; }
  const step = t.closest('[data-cal-step]'); if (step) { calOffset = Math.max(-1, Math.min(3, calOffset + Number(step.dataset.calStep))); calSelected = ''; renderCalendar(); return; }
  const day = t.closest('[data-cal-date]'); if (day) { calSelected = day.dataset.calDate; renderCalendar(); return; }
  const seg = t.closest('[data-market]');
  if (seg) { seg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === seg)); market = seg.dataset.market; hsPage = 1; renderHotspots(); return; }
  if (t.closest('[data-toggle-copy]')) { t.closest('.hs').querySelector('[data-copy]').classList.toggle('open'); return; }
  const tab = t.closest('[data-tab]');
  if (tab) {
    const card = tab.closest('.hs'), h = (D.hotspots || []).find(x => x.id === card.dataset.id);
    tab.parentElement.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab));
    card.querySelector('pre').textContent = (h.copy || {})[tab.dataset.tab] || ''; return;
  }
  if (t.closest('[data-copy-btn]')) {
    try { await navigator.clipboard.writeText(t.closest('[data-copy]').querySelector('pre').textContent); t.textContent = '已复制'; setTimeout(() => t.textContent = '复制', 1200); }
    catch (e) { alert('复制失败，请手动选择文本'); }
    return;
  }
  const pv = t.closest('[data-preview]'); if (pv) { preview(pv.dataset.preview); return; }
  const pb = t.closest('[data-push]'); if (pb) { openGroupMenu(pb, pb.dataset.push); return; }
  if (!t.closest('#gmenu')) closeGroupMenu();
  const ap = t.closest('[data-post]');
  if (ap) {
    const old = ap.textContent; ap.disabled = true; ap.textContent = '处理中…';
    try { const r = await post(ap.dataset.post); alert(r.message || '完成'); } catch (e) { alert(e.message); }
    finally { ap.disabled = false; ap.textContent = old; }
  }
});

$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
$('#modalPush').onclick = e => openGroupMenu(e.target, e.target.dataset.target);
addEventListener('keydown', e => { if (e.key === 'Escape') closeGroupMenu(); });
addEventListener('scroll', closeGroupMenu, true);
$('#prev').onclick = () => { recPage--; renderRecords(); };
$('#next').onclick = () => { recPage++; renderRecords(); };
$('#hsPrev').onclick = () => { hsPage--; renderHotspots(); };
$('#hsNext').onclick = () => { hsPage++; renderHotspots(); };
if ($('#usRefresh')) $('#usRefresh').onclick = async e => {
  const b = e.target, old = b.textContent; b.disabled = true; b.textContent = '刷新中…';
  try { D.us_open = (await (await fetch('/api/dashboard', {cache:'no-store'})).json()).us_open; renderUsOpen(); } catch (err) { alert(err.message); }
  finally { b.disabled = false; b.textContent = old; }
};
if ($('#buildReport')) $('#buildReport').onclick = async e => {
  const b = e.target, old = b.textContent; b.disabled = true; b.textContent = '生成中…';
  try { D.daily_report = (await post('/api/report/build')).report; renderHeader(); renderMacro(); renderTops(); renderProjects(); }
  catch (err) { alert('生成失败：' + err.message); }
  finally { b.disabled = false; b.textContent = old; }
};

async function load(refresh = false) {
  const b = $('#refresh'); b.disabled = true; b.textContent = '更新中…';
  try { D = refresh ? (await post('/api/refresh')).dashboard : await (await fetch('/api/dashboard')).json(); render(); }
  catch (e) { if (refresh) alert('刷新失败：' + e.message); }
  finally { b.disabled = false; b.textContent = '刷新'; }
}

if (SNAP) { $('#actions').innerHTML = '<span class="src">公开只读快照</span>'; render(); }
else { $('#refresh').onclick = () => load(true); load(); setInterval(() => load(false), 60000); }
</script>
</body>
</html>
